<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#3D2010"/>
      <stop offset="100%" stop-color="#1A0C06"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#B8733A" stop-opacity="0.22"/>
      <stop offset="70%"  stop-color="#B8733A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#B8733A" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="560" ry="280" fill="url(#glow)"/>

  <!--
    KinwoveStar above the "i"
    Font: Georgia 158px, text-anchor=middle at x=600
    "i" center estimated at x≈395 for this font size
    Star: 96px × 96px → scale = 96/24 = 4.0
    Star center target: (395, 248)
    Path: M12 1 L13.4 9.6 L22 11 L13.4 12.4 L12 23 L10.6 12.4 L2 11 L10.6 9.6 Z
  -->
  <g transform="translate(395, 248) scale(4) translate(-12, -12)" filter="url(#starGlow)">
    <path fill="#C07838"
          d="M12 1 L13.4 9.6 L22 11 L13.4 12.4 L12 23 L10.6 12.4 L2 11 L10.6 9.6 Z"/>
  </g>

  <!-- Wordmark — bigger, bolder -->
  <text x="600" y="460"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="158" font-weight="500"
        text-anchor="middle" fill="#FDF8F0" letter-spacing="-5">
    kinwove
  </text>

  <!-- Tagline -->
  <text x="600" y="530"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="28"
        text-anchor="middle" fill="#C8AD80" letter-spacing="2">
    Big questions, ancient text, modern conversation.
  </text>

  <!-- Domain -->
  <text x="600" y="598"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" letter-spacing="7"
        text-anchor="middle" fill="#7A4A20">
    KINWOVE.COM
  </text>
</svg>
