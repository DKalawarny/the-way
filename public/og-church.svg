<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630' viewBox='0 0 1200 630'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='45%' r='65%'>
      <stop offset='0%' stop-color='#3D2010'/>
      <stop offset='100%' stop-color='#1A0C06'/>
    </radialGradient>
    <radialGradient id='glow' cx='50%' cy='50%' r='55%'>
      <stop offset='0%' stop-color='#B8733A' stop-opacity='0.25'/>
      <stop offset='70%' stop-color='#B8733A' stop-opacity='0.06'/>
      <stop offset='100%' stop-color='#B8733A' stop-opacity='0'/>
    </radialGradient>
    <filter id='sg' x='-80%' y='-80%' width='260%' height='260%'>
      <feGaussianBlur in='SourceGraphic' stdDeviation='7' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='1200' height='630' fill='url(#bg)'/>
  <ellipse cx='600' cy='300' rx='560' ry='280' fill='url(#glow)'/>
  <!-- Star above the 'i' — 148px, scale=148/24=6.167, center (355,148) -->
  <g transform='translate(355,148) scale(6.167) translate(-12,-12)' filter='url(#sg)'>
    <path fill='#C07838' d='M12 1 L13.4 9.6 L22 11 L13.4 12.4 L12 23 L10.6 12.4 L2 11 L10.6 9.6 Z'/>
  </g>
  <!-- Wordmark 210px — dotless-i (ı U+0131) so only the star sits above the i -->
  <text x='600' y='415' font-family="Georgia,'Times New Roman',serif" font-size='210' font-weight='500' text-anchor='middle' fill='#FDF8F0' letter-spacing='-6'>kınwove</text>
  <!-- Tagline — canonical brand slogan (matches og:title / site) -->
  <text x='600' y='478' font-family="Georgia,'Times New Roman',serif" font-style='italic' font-size='26' text-anchor='middle' fill='#C8AD80' letter-spacing='1.5'>Real answers to hard faith questions</text>
  <!-- Domain -->
  <text x='600' y='578' font-family="Georgia,'Times New Roman',serif" font-size='16' letter-spacing='7' text-anchor='middle' fill='#7A4A20'>KINWOVE.COM</text>
</svg>
