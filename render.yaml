services:
  - type: web
    name: kinwove
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    # Zero-downtime deploys: Render only switches traffic to a new deploy after
    # this path returns 200 — a build that crashes on boot never replaces the
    # healthy running version. (Also set this in the dashboard: Settings →
    # Health Check Path, since dashboard-created services ignore render.yaml.)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
