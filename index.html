        <h1>Big questions. Ancient text. Honest conversation.</h1>
        <p>
          kinwove is a free AI-powered Bible study and Christian community app.
          Ask any question about scripture, faith, or doubt — and get a thoughtful,
          grace-first answer. No pressure. No agenda. Whether you're a lifelong
          believer, a new Christian, or just curious, there's a place for you here.
        </p>

        <h2>AI Bible companion</h2>
        <p>
          Ask anything about the Bible, theology, Christian living, or hard questions
          about faith. Our AI responds with warmth and intellectual honesty — quoting
          scripture, acknowledging complexity, and never talking down to you.
        </p>

        <h2>Church community</h2>
        <p>
          Connect with your local church, follow your pastor's weekly sermon, discuss
          the Sunday message with your congregation, and pray for one another. kinwove
          is a church community app designed around depth, not noise.
        </p>

        <h2>Church directory</h2>
        <p>
          Search thousands of churches by denomination, city, and name. Pastors can
          claim their listing, post sermon content, and invite members.
        </p>

        <h2>Prayer wall &amp; guided journeys</h2>
        <p>
          Keep a personal prayer list, share requests with your group, and work through
          structured reading journeys — Gospels, Psalms, Epistles, and more.
        </p>

        <ul>

          <li>Church members who want to go deeper than Sunday morning</li>
